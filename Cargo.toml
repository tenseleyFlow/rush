[workspace]
members = [
    "crates/rush-cli",
    "crates/rush-parser",
    "crates/rush-expand",
    "crates/rush-executor",
    "crates/rush-job",
    "crates/rush-eval",
    "crates/rush-interactive",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["tenseleyFlow"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tenseleyFlow/rush"

[workspace.dependencies]
# Parsing
pest = "2.7"
pest_derive = "2.7"

# REPL and terminal
reedline = "0.36"
crossterm = "0.28"
nu-ansi-term = "0.50"

# System calls (Unix)
nix = { version = "0.29", features = ["process", "signal", "term", "fs"] }

# Pattern matching
globset = "0.4"
regex = "1.10"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Testing
proptest = "1.4"
